<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15253b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ortsschulung">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<title>Ortsschulung</title>
<style>
:root{--navy:#15253b;--red:#e31b23;--green:#218c46;--bg:#eef2f6;--card:#fff;--text:#172033;--muted:#6d7786;--line:#d8dde5}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}
body{padding-bottom:84px}
header{position:sticky;top:0;z-index:20;background:#fff;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.headerRow{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:900px;margin:auto}
h1{font-size:28px;margin:0;font-weight:900}
main{max-width:900px;margin:auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 8px 28px rgba(21,37,59,.08)}
label{display:block;font-size:14px;font-weight:800;margin:0 0 8px}
input,textarea,select{width:100%;border:1px solid #cfd6df;border-radius:14px;padding:15px 16px;font:inherit;background:#fff;color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:#6587ae;box-shadow:0 0 0 3px rgba(101,135,174,.15)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.actions{grid-template-columns:1fr!important}h1{font-size:24px}}
.status{font-size:14px;color:var(--muted);margin-top:8px}
.status.ok{color:var(--green);font-weight:700}
.suggest{margin-top:8px;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;display:none;max-height:280px;overflow-y:auto}
.suggest button{display:block;width:100%;text-align:left;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:#fff;font:inherit}
.suggest button:last-child{border-bottom:0}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:14px}
.actions button,.primary,.secondary{border:0;border-radius:14px;padding:15px 16px;font:inherit;font-weight:800}
.primary{background:var(--navy);color:#fff;width:100%}
.secondary{background:#fff;border:1px solid var(--line);color:var(--text)}
.red{background:var(--red);color:white}
.green{background:var(--green);color:white}
.savedItem{padding:14px;border:1px solid var(--line);border-radius:14px;margin-top:10px}
.savedItem strong{display:block}
.savedTop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.validityBadge{display:inline-block;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900;white-space:nowrap}
.validityOk{background:#e8f5ec;color:#176b36}
.validitySoon{background:#fff4d6;color:#8a5a00}
.validityExpired{background:#fde8e8;color:#a61b1b}
.muted{color:var(--muted);font-size:13px}
.footer{position:fixed;bottom:0;left:0;right:0;background:var(--navy);color:#fff;padding:12px 18px;font-size:13px;text-align:center;z-index:30}
</style>
</head>
<body>
<header>
  <div class="headerRow">
    <h1>Ortsschulung erstellen</h1>
    <div style="font-weight:900;color:#d71920">ÖBB</div>
  </div>
</header>
<main>
  <section class="card">
    <h2 style="margin-top:0">Bahnhof / Betriebsstelle</h2>
    <label for="station">Bahnhof suchen</label>
    <input id="station" autocomplete="off" placeholder="z. B. Wien Meidling">
    <div id="stationStatus" class="status">Bahnhof eingeben und aus Vorschlägen auswählen.</div>
    <div id="suggestions" class="suggest"></div>
  </section>

  <section class="card">
    <div class="grid2">
      <div>
        <label for="trainingDate">Datum der Ortsschulung</label>
        <input id="trainingDate" type="date">
      </div>
      <div>
        <label>Gültigkeit</label>
        <input value="1 Jahr" disabled>
      </div>
      <div>
        <label>Breitengrad (GPS)</label>
        <input id="lat" placeholder="automatisch" readonly>
      </div>
      <div>
        <label>Längengrad (GPS)</label>
        <input id="lon" placeholder="automatisch" readonly>
      </div>
    </div>
    <div class="actions">
      <button class="red" id="myLocation">📍 Mein Standort</button>
      <button class="secondary" id="openMap">🗺 Bahnhof auf Karte</button>
      <button class="green" id="navigate">🚗 Navigation starten</button>
    </div>
  </section>

  <section class="card">
    <div class="grid2">
      <div>
        <label for="participants">Teilnehmerkreis (optional)</label>
        <input id="participants" placeholder="z. B. Baufacharbeiter">
      </div>
      <div>
        <label for="trainer">Schulungsleiter / Referent (optional)</label>
        <input id="trainer" placeholder="Name eingeben">
      </div>
    </div>
    <label for="notes" style="margin-top:14px">Anmerkungen</label>
    <textarea id="notes" rows="4" placeholder="Zusätzliche Hinweise (optional)"></textarea>
  </section>

  <section class="card">
    <button class="primary" id="save">✓ Ortsschulung speichern</button>
  </section>

  <section class="card">
    <h2 style="margin-top:0">Gespeicherte Ortsschulungen</h2>
    <input id="savedSearch" placeholder="🔎 Bahnhof suchen...">
    <div id="savedList"></div>
  </section>
</main>
<div class="footer">Gültigkeitsdauer: 1 Jahr ab Schulungsdatum</div>

const $=id=>document.getElementById(id);
const norm=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
const storageKey='ortsschulung_v2_items';

function localISO(d=new Date()){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
$('trainingDate').value=localISO();

function stationAliases(query){
  const q=norm(query);
  const aliases={
    'wien maxing':'maxing',
    'wien zentral verschiebe bahnhof':'wien zentralverschiebebahnhof',
    'zentral verschiebe bahnhof':'wien zentralverschiebebahnhof',
    'zentralverschiebebahnhof':'wien zentralverschiebebahnhof',
    'wien kledering':'wien zentralverschiebebahnhof'
  };
  return aliases[q]||q;
}

function searchStations(q){
  q=stationAliases(q);
  if(!q) return [];
  return STATIONS
    .map(s=>({...s,n:norm(s.name)}))
    .filter(s=>s.n.includes(q)||q.includes(s.n))
    .sort((a,b)=>{
      const as=a.n.startsWith(q)?0:1, bs=b.n.startsWith(q)?0:1;
      return as-bs || a.name.localeCompare(b.name,'de');
    })
    .slice(0,20);
}

function selectStation(s){
  $('station').value=s.name;
  $('lat').value=Number(s.lat).toFixed(6);
  $('lon').value=Number(s.lon).toFixed(6);
  $('stationStatus').className='status ok';
  $('stationStatus').textContent='✓ GPS automatisch gefunden: '+s.name;
  $('suggestions').style.display='none';
}

function renderSuggestions(){
  const q=$('station').value.trim();
  const box=$('suggestions');
  const hits=searchStations(q);
  box.innerHTML='';
  if(q.length<2||!hits.length){box.style.display='none';return}
  hits.forEach(s=>{
    const b=document.createElement('button');
    b.type='button'; b.textContent=s.name;
    b.addEventListener('click',()=>selectStation(s));
    b.addEventListener('touchstart',e=>{e.preventDefault();selectStation(s)},{passive:false});
    box.appendChild(b);
  });
  box.style.display='block';
}

let t=null;
$('station').addEventListener('input',()=>{
  clearTimeout(t);
  $('stationStatus').className='status';
  $('stationStatus').textContent='Bahnhof eingeben und aus Vorschlägen auswählen.';
  $('lat').value=''; $('lon').value='';
  t=setTimeout(renderSuggestions,120);
});
$('station').addEventListener('focus',renderSuggestions);

function distanceKm(lat1,lon1,lat2,lon2){
  const R=6371;
  const rad=v=>v*Math.PI/180;
  const dLat=rad(lat2-lat1),dLon=rad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function nearestStation(lat,lon){
  let best=null,bestKm=Infinity;
  for(const s of STATIONS){
    const km=distanceKm(lat,lon,Number(s.lat),Number(s.lon));
    if(km<bestKm){best=s;bestKm=km}
  }
  return best?{station:best,km:bestKm}:null;
}

$('myLocation').addEventListener('click',()=>{
  if(!navigator.geolocation){alert('Standort wird von diesem Gerät nicht unterstützt.');return}
  $('stationStatus').className='status';
  $('stationStatus').textContent='📍 Standort wird ermittelt …';
  $('suggestions').style.display='none';
  navigator.geolocation.getCurrentPosition(p=>{
    const lat=p.coords.latitude,lon=p.coords.longitude;
    $('lat').value=lat.toFixed(6);
    $('lon').value=lon.toFixed(6);
    $('station').value='';
    const near=nearestStation(lat,lon);
    $('stationStatus').className='status ok';
    $('stationStatus').textContent=near
      ? '✓ Aktueller Standort übernommen. Nächste gespeicherte Betriebsstelle: '+near.station.name+' ('+(near.km<1?Math.round(near.km*1000)+' m':near.km.toFixed(1)+' km')+').'
      : '✓ Aktueller Standort übernommen.';
  },()=>{
    $('stationStatus').className='status';
    $('stationStatus').textContent='Standort konnte nicht geladen werden.';
  },{enableHighAccuracy:true,timeout:12000,maxAge:30000});
});

function coords(){
  const lat=parseFloat($('lat').value),lon=parseFloat($('lon').value);
  return Number.isFinite(lat)&&Number.isFinite(lon)?{lat,lon}:null;
}
$('openMap').addEventListener('click',()=>{
  const c=coords(); if(!c){alert('Bitte zuerst einen Bahnhof auswählen.');return}
  window.open('https://www.openrailwaymap.org/?style=standard&lat='+encodeURIComponent(c.lat)+'&lon='+encodeURIComponent(c.lon)+'&zoom=16','_blank','noopener');
});
$('navigate').addEventListener('click',()=>{
  const c=coords(); if(!c){alert('Bitte zuerst einen Bahnhof auswählen.');return}
  window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(c.lat+','+c.lon),'_blank','noopener');
});

function loadItems(){try{return JSON.parse(localStorage.getItem(storageKey)||'[]')}catch{return []}}
function saveItems(items){localStorage.setItem(storageKey,JSON.stringify(items))}
function validityInfo(validUntil){
  const end=new Date(validUntil+'T23:59:59');
  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const days=Math.ceil((end-today)/86400000);

  if(!Number.isFinite(days)) return {label:'Unbekannt',cls:'validitySoon',detail:''};
  if(days<0) return {
    label:'Abgelaufen',
    cls:'validityExpired',
    detail:'seit '+Math.abs(days)+' Tag'+(Math.abs(days)===1?'':'en')+' abgelaufen'
  };
  if(days===0) return {label:'Läuft heute ab',cls:'validitySoon',detail:'läuft heute ab'};
  if(days<=30) return {
    label:'Bald fällig',
    cls:'validitySoon',
    detail:'noch '+days+' Tag'+(days===1?'':'e')+' gültig'
  };
  return {
    label:'Gültig',
    cls:'validityOk',
    detail:'noch '+days+' Tage gültig'
  };
}

function renderSaved(){
  const q=norm($('savedSearch').value);
  const items=loadItems().filter(x=>!q||norm(x.station).includes(q));
  const box=$('savedList'); box.innerHTML='';
  if(!items.length){box.innerHTML='<div class="muted" style="padding:16px 0">Noch keine Ortsschulungen gespeichert.</div>';return}
  items.forEach(x=>{
    const v=validityInfo(x.validUntil);
    const d=document.createElement('div'); d.className='savedItem';
    d.innerHTML=
      '<div class="savedTop">'+
        '<div><strong>'+escapeHtml(x.station)+'</strong>'+
        '<span class="muted">'+escapeHtml(x.date)+' · gültig bis '+escapeHtml(x.validUntil)+'</span></div>'+
        '<span class="validityBadge '+v.cls+'">'+escapeHtml(v.label)+'</span>'+
      '</div>'+
      '<div class="muted" style="margin-top:8px">'+escapeHtml(v.detail)+'</div>';
    box.appendChild(d);
  });
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

$('save').addEventListener('click',()=>{
  const station=$('station').value.trim();
  const c=coords();
  if(!station||!c){alert('Bitte zuerst einen Bahnhof aus der Trefferliste auswählen.');return}
  const date=$('trainingDate').value||localISO();
  const d=new Date(date+'T12:00:00'); d.setFullYear(d.getFullYear()+1);
  const item={
    id:Date.now(),station,date,validUntil:localISO(d),lat:c.lat,lon:c.lon,
    participants:$('participants').value.trim(),
    trainer:$('trainer').value.trim(),
    notes:$('notes').value.trim()
  };
  const items=loadItems(); items.unshift(item); saveItems(items);
  renderSaved();
  alert('Ortsschulung gespeichert.');
});
$('savedSearch').addEventListener('input',renderSaved);
renderSaved();
</script>
