<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSB & Lageskizzen</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f141c;
      color: #ffffff;
    }

    header {
      background: #d71920;
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    main {
      max-width: 760px;
      margin: auto;
      padding: 16px;
    }

    .card {
      background: #1a2230;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    h2 {
      margin-top: 0;
      font-size: 19px;
    }

    .upload {
      display: block;
      width: 100%;
      background: #d71920;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
    }

    input[type="file"] {
      display: none;
    }

    input[type="search"] {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
    }

    .info {
      background: #101721;
      padding: 12px;
      border-radius: 10px;
      line-height: 1.5;
      margin-top: 12px;
    }

    .category {
      margin-top: 18px;
    }

    .category-title {
      font-weight: bold;
      margin-bottom: 8px;
      color: #ffdddd;
    }

    .doc {
      background: #101721;
      padding: 10px;
      border-radius: 9px;
      margin-bottom: 7px;
      word-break: break-word;
    }

    .doc button {
      margin-top: 8px;
      border: none;
      background: #d71920;
      color: white;
      padding: 8px 12px;
      border-radius: 7px;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    .ok {
      color: #87e59c;
    }

    .error {
      color: #ff8d8d;
    }

    .small {
      font-size: 13px;
      color: #aeb8c6;
    }
  </style>
</head>

<body>

<header>
  BSB & Lageskizzen
</header>

<main>

  <div class="card">
    <h2>BSB-ZIP auswählen</h2>

    <label class="upload" for="zipFile">
      ZIP-Datei auswählen
    </label>

    <input
      id="zipFile"
      type="file"
      accept=".zip,application/zip"
    >

    <div id="status" class="info">
      Noch keine BSB-ZIP geladen.
    </div>
  </div>

  <div id="stationCard" class="card hidden">
    <h2>Bahnhof</h2>

    <div id="stationInfo" class="info"></div>
  </div>

  <div id="searchCard" class="card hidden">
    <h2>Dokument suchen</h2>

    <input
      id="search"
      type="search"
      placeholder="z. B. Gleisfunktionen, Bahnsteig, PZB ..."
    >
  </div>

  <div id="documentsCard" class="card hidden">
    <h2>Dokumente</h2>

    <div id="documents"></div>
  </div>

</main>

<script>
  const zipFile = document.getElementById("zipFile");
  const status = document.getElementById("status");
  const stationCard = document.getElementById("stationCard");
  const stationInfo = document.getElementById("stationInfo");
  const searchCard = document.getElementById("searchCard");
  const documentsCard = document.getElementById("documentsCard");
  const documents = document.getElementById("documents");
  const search = document.getElementById("search");

  let loadedFiles = [];

  zipFile.addEventListener("change", async function () {
    const file = this.files[0];

    if (!file) {
      return;
    }

    status.innerHTML = "ZIP-Datei wird gelesen ...";

    try {
      const zip = await JSZip.loadAsync(file);

      loadedFiles = [];

      zip.forEach((path, entry) => {
        if (!entry.dir && path.toLowerCase().endsWith(".pdf")) {
          loadedFiles.push({
            path,
            entry
          });
        }
      });

      const info = parseFileName(file.name);

      stationInfo.innerHTML =
        "<strong>Bahnhof:</strong> " + escapeHtml(info.station) + "<br>" +
        "<strong>Kürzel:</strong> " + escapeHtml(info.code) + "<br>" +
        "<strong>Version:</strong> " + escapeHtml(info.version) + "<br>" +
        "<strong>Gültigkeitsdatum:</strong> " + escapeHtml(info.date);

      status.innerHTML =
        "<span class='ok'>✓ BSB-ZIP erfolgreich erkannt.</span><br>" +
        loadedFiles.length + " PDF-Dokumente gefunden.";

      stationCard.classList.remove("hidden");
      searchCard.classList.remove("hidden");
      documentsCard.classList.remove("hidden");

      renderDocuments();

    } catch (error) {
      console.error(error);

      status.innerHTML =
        "<span class='error'>ZIP-Datei konnte nicht gelesen werden.</span>";
    }
  });

  search.addEventListener("input", renderDocuments);

  function parseFileName(filename) {
    const clean = filename.replace(/\.zip$/i, "");

    const match = clean.match(
      /^Bsb_(.+?)_([^_]+)_V([\d.]+)_([0-9]{2}\.[0-9]{2}\.[0-9]{4})/i
    );

    if (!match) {
      return {
        station: "Unbekannt",
        code: "Unbekannt",
        version: "Unbekannt",
        date: "Unbekannt"
      };
    }

    return {
      station: match[1],
      code: match[2],
      version: "V" + match[3],
      date: match[4]
    };
  }

  function getCategory(path) {
    if (path.startsWith("Lageskizzen/")) {
      return "Lageskizzen";
    }

    if (path.startsWith("Anlagen/")) {
      return "Anlagen";
    }

    if (path.startsWith("Infrastrukturanlagen/")) {
      return "Infrastrukturanlagen";
    }

    if (path.startsWith("Mitgeltende Dokumente/")) {
      return "Mitgeltende Dokumente";
    }

    if (path.toLowerCase().startsWith("bsb_")) {
      return "Haupt-BSB";
    }

    return "Sonstige Dokumente";
  }

  function renderDocuments() {
    const filter = search.value.trim().toLowerCase();

    documents.innerHTML = "";

    const categories = [
      "Haupt-BSB",
      "Lageskizzen",
      "Anlagen",
      "Infrastrukturanlagen",
      "Mitgeltende Dokumente",
      "Sonstige Dokumente"
    ];

    categories.forEach(category => {

      const files = loadedFiles.filter(item => {
        const matchesCategory =
          getCategory(item.path) === category;

        const matchesSearch =
          !filter ||
          item.path.toLowerCase().includes(filter);

        return matchesCategory && matchesSearch;
      });

      if (files.length === 0) {
        return;
      }

      const categoryDiv = document.createElement("div");
      categoryDiv.className = "category";

      const title = document.createElement("div");
      title.className = "category-title";
      title.textContent =
        category + " (" + files.length + ")";

      categoryDiv.appendChild(title);

      files.forEach(item => {

        const doc = document.createElement("div");
        doc.className = "doc";

        const filename =
          item.path.split("/").pop();

        const name = document.createElement("div");
        name.textContent = filename;

        const button = document.createElement("button");
        button.textContent = "PDF öffnen";

        button.addEventListener("click", async () => {
          button.disabled = true;
          button.textContent = "Öffne ...";

          try {
          const pdfData =
  await item.entry.async("arraybuffer");

const pdfBlob = new Blob(
  [pdfData],
  { type: "application/pdf" }
);

const url = URL.createObjectURL(pdfBlob);

const link = document.createElement("a");
link.href = url;
link.download = filename;
document.body.appendChild(link);
link.click();
link.remove();

setTimeout(() => {
  URL.revokeObjectURL(url);
}, 60000);

          } catch (error) {
            alert("PDF konnte nicht geöffnet werden.");
          }

          button.disabled = false;
          button.textContent = "PDF öffnen";
        });

        doc.appendChild(name);
        doc.appendChild(button);
        categoryDiv.appendChild(doc);
      });

      documents.appendChild(categoryDiv);
    });

    if (!documents.innerHTML) {
      documents.innerHTML =
        "<div class='info'>Keine passenden Dokumente gefunden.</div>";
    }
  }

  function escapeHtml(text) {
    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }
</script>

</body>
</html>
