
name: Android APK bauen

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Abhängigkeiten installieren
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Android-Projekt erzeugen
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Capacitor synchronisieren
        run: npx cap sync android

      - name: Android Standort-Berechtigungen eintragen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          perms = [
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'
          ]
          missing = [x for x in perms if x not in s]
          if missing:
              s = s.replace("<application", "\n    " + "\n    ".join(missing) + "\n\n    <application", 1)
              p.write_text(s, encoding="utf-8")
          print(p.read_text(encoding="utf-8"))
          PY

      - name: GPS-Fix Web-App direkt in Android übernehmen
        run: |
          test -f www/index-android-v13-gps-fix.html
          mkdir -p android/app/src/main/assets/public
          cp -a www/. android/app/src/main/assets/public/
          cp www/index.html android/app/src/main/assets/public/index.html

      - name: Prüfen ob GPS-Fix eingebaut wird
        run: |
          grep -q "Neue Ortsschulung" android/app/src/main/assets/public/index.html
          grep -q "GPS erfassen" android/app/src/main/assets/public/index.html
          grep -q "Standortberechtigung" android/app/src/main/assets/public/index.html
          grep -q "ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml
          echo "OK: GPS-Fix und Standort-Berechtigungen sind eingebaut."

      - name: Gradle ausführbar machen
        run: chmod +x android/gradlew

      - name: Debug-APK bauen
        working-directory: android
        run: ./gradlew assembleDebug

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Ortsschulung-Android-APK-GPS-FIX
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
