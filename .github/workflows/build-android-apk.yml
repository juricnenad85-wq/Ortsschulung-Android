name: Android APK bauen

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
- name: Aktuelle Web-App verwenden
  run: cp www/index-android-v13.html www/index.html
      - name: Web-App nach Android synchronisieren
        run: npx cap sync android

      - name: Gradle ausführbar machen
        run: chmod +x android/gradlew

      - name: Debug-APK bauen
        working-directory: android
        run: ./gradlew assembleDebug

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Ortsschulung-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
